<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<base target="_top">
<style>
:root{
  --bg:#F7F8FA; --surface:#fff; --primary:#2563EB; --primary-l:#EFF6FF;
  --accent:#10B981; --accent-l:#ECFDF5; --text:#111827; --sub:#6B7280;
  --border:#E5E7EB; --error:#EF4444; --error-l:#FEF2F2;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg);color:var(--text);
  font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  max-width:480px;margin:0 auto;padding-bottom:76px;
}
header{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:14px 18px;display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:10;
}
header .icon{font-size:24px}
header h1{font-size:16px;font-weight:700}
header .sub{font-size:11px;color:var(--sub)}
header .logout{background:none;border:1px solid var(--border);border-radius:8px;
  padding:5px 9px;font-size:14px;color:var(--sub);margin-left:6px;flex-shrink:0}
header .badge{
  margin-left:auto;font-size:11px;font-weight:600;padding:4px 10px;
  border-radius:20px;background:var(--primary-l);color:var(--primary);white-space:nowrap;
}
main{padding:18px 14px}

.card{background:var(--surface);border-radius:14px;padding:18px 14px;
  margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card-title{font-size:12px;font-weight:700;color:var(--sub);
  letter-spacing:.8px;margin-bottom:12px}

.upload{border:2px dashed var(--border);border-radius:16px;background:var(--surface);
  padding:38px 18px;text-align:center}
.upload .emoji{font-size:46px;margin-bottom:10px}
.upload h2{font-size:16px;margin-bottom:6px}
.upload p{font-size:13px;color:var(--sub);margin-bottom:22px}

button{font-family:inherit;cursor:pointer}
.btn-main{display:inline-flex;align-items:center;gap:8px;background:var(--primary);
  color:#fff;border:none;border-radius:10px;padding:12px 26px;font-size:15px;font-weight:600}
.btn-out{display:inline-flex;align-items:center;gap:6px;background:none;color:var(--primary);
  border:1.5px solid var(--primary);border-radius:10px;padding:10px 20px;font-size:14px;font-weight:500;margin-top:10px}
.btn-block{width:100%;background:var(--primary);color:#fff;border:none;border-radius:12px;
  padding:14px;font-size:16px;font-weight:700;margin-top:4px}
.btn-ghost{width:100%;background:none;color:var(--sub);border:1.5px solid var(--border);
  border-radius:12px;padding:12px;font-size:15px;margin-top:8px}

label{display:block;font-size:12px;font-weight:600;color:var(--sub);margin-bottom:4px}
input,select{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:9px 11px;
  font-size:15px;font-family:inherit;color:var(--text);background:var(--bg);outline:none}
input:focus,select:focus{border-color:var(--primary)}
.field{margin-bottom:12px}

.items-head,.item-row{display:grid;grid-template-columns:1fr 70px 58px 74px 28px;gap:5px;align-items:center}
.items-head{margin-bottom:6px}
.items-head span{font-size:10px;color:var(--sub);font-weight:600;text-align:center}
.items-head span:first-child{text-align:left}
.item-row{margin-bottom:7px}
.item-row input{padding:8px 8px;font-size:14px}
.item-row .num{text-align:right}
.sub-cell{font-size:13px;text-align:right;padding:9px 6px;background:var(--bg);
  border-radius:7px;border:1.5px solid var(--border);color:var(--sub)}
.sub-cell.on{color:var(--text);font-weight:600}
.del{background:none;border:none;color:var(--error);font-size:18px;line-height:1;padding:4px}
.add{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;
  background:var(--primary-l);color:var(--primary);border:1.5px dashed var(--primary);
  border-radius:8px;padding:9px;font-size:14px;font-weight:600;margin-top:4px}

.total{background:var(--primary);border-radius:12px;padding:13px 18px;
  display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;color:#fff}
.total .label{font-size:14px;font-weight:600}
.total .amt{font-size:22px;font-weight:700}

.alert{border-radius:12px;padding:13px 15px;margin-bottom:12px;font-size:14px;
  display:flex;align-items:center;gap:9px}
.alert.err{background:var(--error-l);border:1px solid var(--error);color:var(--error)}
.alert.ok{background:var(--accent-l);border:1px solid var(--accent);color:#065F46}
.spin{width:18px;height:18px;border:3px solid var(--primary-l);border-top:3px solid var(--primary);
  border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:10}
nav button{flex:1;padding:9px 0 11px;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:none;border:none;border-top:2px solid transparent;color:var(--sub);font-size:10px}
nav button.on{color:var(--primary);border-top-color:var(--primary);font-weight:700}
nav button .ic{font-size:21px}

.big{font-size:31px;font-weight:700;color:var(--primary);margin:3px 0}
.stat-sub{font-size:13px;color:var(--sub)}
.bar-row{margin-bottom:9px}
.bar-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.bar-track{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .5s}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}
.list-row{display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--border)}
.list-row:last-child{border-bottom:none}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.center{text-align:center}
.muted{color:var(--sub);font-size:13px}
.hidden{display:none!important}
img.preview{width:100%;border-radius:12px;max-height:190px;object-fit:cover;margin-bottom:14px}
.filters{display:flex;gap:7px;margin-bottom:14px}
.filters select{flex:1}
.filters button{background:var(--primary-l);color:var(--primary);border:none;
  border-radius:8px;padding:0 13px;font-size:17px}
.gate{padding:60px 26px;text-align:center}
.gate .emoji{font-size:56px;margin-bottom:14px}
.gate h2{font-size:19px;margin-bottom:10px}
.gate p{font-size:14px;color:var(--sub);line-height:1.8}
</style>
</head>
<body>

<!-- 起動中 -->
<div id="boot" class="gate">
  <div class="spin" style="margin:0 auto 16px"></div>
  <p class="muted">読み込み中…</p>
</div>

<!-- ログイン画面 -->
<div id="login" class="gate hidden">
  <div class="emoji">🧾</div>
  <h2>レシート管理</h2>
  <p style="margin-bottom:26px">部署コードと氏名を入力してください</p>
  <div id="loginAlert"></div>
  <div style="text-align:left;max-width:300px;margin:0 auto">
    <div class="field">
      <label>部署コード</label>
      <input id="inCode" type="text" placeholder="例：SOUMU-2026" autocapitalize="characters">
    </div>
    <div class="field">
      <label>氏名</label>
      <input id="inName" type="text" placeholder="例：山田 太郎">
    </div>
    <button class="btn-block" id="loginBtn" onclick="doLogin()">ログイン</button>
  </div>
  <p class="muted" style="font-size:12px;margin-top:20px;line-height:1.7">
    次回以降はこの入力は不要です。<br>部署コードは管理者から受け取ってください。
  </p>
</div>

<!-- 本体 -->
<div id="app" class="hidden">
  <header>
    <span class="icon">🧾</span>
    <div>
      <h1 id="hTitle">レシート登録</h1>
      <div class="sub" id="hUser"></div>
    </div>
    <span class="badge" id="hDept"></span>
    <button class="logout" onclick="logout()" title="ログアウト">⏏</button>
  </header>

  <main>
    <div id="alert"></div>

    <!-- 撮影 -->
    <section id="scUpload">
      <div class="upload">
        <div class="emoji">📷</div>
        <h2>レシートを取り込む</h2>
        <p>撮影すると品目・単価・数量を自動で読み取ります</p>
        <button class="btn-main" onclick="document.getElementById('cam').click()">📸 カメラで撮影</button><br>
        <button class="btn-out" onclick="document.getElementById('fil').click()">🖼️ ファイルを選ぶ</button>
        <input id="cam" type="file" accept="image/*" capture="environment" class="hidden">
        <input id="fil" type="file" accept="image/*" class="hidden">
      </div>
    </section>

    <!-- 確認 -->
    <section id="scReview" class="hidden">
      <img id="preview" class="preview hidden" alt="">
      <div class="card">
        <div class="card-title">基本情報</div>
        <div class="field"><label>日付</label><input id="fDate" type="date"></div>
        <div class="field"><label>店名</label><input id="fStore" type="text" placeholder="店名を入力"></div>
        <div class="field"><label>カテゴリ</label><select id="fCat"></select></div>
        <div class="field hidden" id="deptPickWrap">
          <label>登録先の部署</label><select id="fDept"></select>
        </div>
      </div>
      <div class="card">
        <div class="card-title" id="itemsTitle">品目一覧</div>
        <div class="items-head">
          <span>品目名</span><span>単価</span><span>数量</span><span>小計</span><span></span>
        </div>
        <div id="itemList"></div>
        <button class="add" onclick="addItem()">＋ 品目を追加</button>
      </div>
      <div class="total"><span class="label">合計金額</span><span class="amt" id="totalAmt">¥0</span></div>
      <button class="btn-block" onclick="save()">✅ スプレッドシートに登録</button>
      <button class="btn-ghost" onclick="toUpload()">← 撮り直す</button>
    </section>

    <!-- 完了 -->
    <section id="scDone" class="hidden">
      <div class="card center">
        <div style="font-size:54px;margin-bottom:8px">✅</div>
        <h2 style="font-size:21px;margin-bottom:6px">登録完了！</h2>
        <p class="muted" id="doneMsg" style="margin-bottom:18px"></p>
        <button class="btn-block" onclick="toUpload()">📷 次のレシートを登録</button>
        <button class="btn-ghost" onclick="switchTab('summary')">📊 集計を確認する</button>
      </div>
    </section>

    <!-- 集計 -->
    <section id="scSummary" class="hidden">
      <div class="filters">
        <select id="fMonth" onchange="renderSummary()"></select>
        <select id="fScope" onchange="loadSummary()"></select>
        <button onclick="loadSummary()">↻</button>
      </div>
      <div id="summaryBody"></div>
    </section>
  </main>

  <nav>
    <button id="tabUpload" class="on" onclick="switchTab('upload')">
      <span class="ic">📷</span><span>登録</span></button>
    <button id="tabSummary" onclick="switchTab('summary')">
      <span class="ic">📊</span><span>集計</span></button>
  </nav>
</div>

<script>
// ═══════════════════════════════════════════════
// ★ここを設定★ GASのデプロイURL（末尾は /exec）
// ═══════════════════════════════════════════════
var API_URL = 'https://script.google.com/macros/s/AKfycbwHxmB7BY3V_SwIUzPQ7J9_X_7b6DyMryU_CGf3VrYQfH_PKL1il9vPfJRLuMKY3COP/exec';

/**
 * GAS API を呼び出す
 * Content-Type を text/plain にすることでCORSプリフライトを回避
 */
function api(action, params){
  var body = Object.assign({ action: action }, params || {});
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  })
  .then(function(res){
    if(!res.ok) throw new Error('通信エラー（' + res.status + '）');
    return res.json();
  })
  .then(function(json){
    if(!json.ok) throw new Error(json.error || '処理に失敗しました');
    return json.data;
  });
}

var USER = null;
var TOKEN = null;
var items = [];
var summaryRows = [];
var tab = 'upload';

var CAT_COLOR = {
  // 生活費系 — 暖色
  '食費':          ['#FEE2E2','#991B1B'],
  '日用品費':      ['#FFEDD5','#9A3412'],
  '消耗品':        ['#FEF3C7','#92400E'],
  '雑費':          ['#FEF9C3','#854D0E'],
  // 医療 — 緑
  '医療費':        ['#DCFCE7','#166534'],
  // 光熱・水道系 — 寒色（種類ごとに色相をずらす）
  '水道料':        ['#CFFAFE','#155E75'],
  '電気代':        ['#DBEAFE','#1E40AF'],
  'ガス代':        ['#E0E7FF','#3730A3'],
  '灯油代':        ['#EDE9FE','#5B21B6'],
  // 通信 — 紫系
  '電話代':        ['#FAE8FF','#86198F'],
  '通信費':        ['#F3E8FF','#6B21A8'],
  // ペット — ピンク
  'ペット用品費':  ['#FCE7F3','#9D174D'],
  // その他 — グレー
  'その他':        ['#F3F4F6','#374151']
};

// ── 起動：保存済みトークンで自動ログインを試す ──
(function boot(){
  // API_URL の設定漏れをチェック
  if(API_URL.indexOf('ここにデプロイIDを貼る') >= 0){
    document.getElementById('boot').innerHTML =
      '<div class="emoji">⚙️</div>' +
      '<h2>設定が必要です</h2>' +
      '<p>index.html の API_URL に<br>GASのデプロイURLを設定してください。</p>';
    return;
  }

  var saved = null;
  try { saved = localStorage.getItem('receiptToken'); } catch(e){}

  if(!saved){ showLogin(); return; }

  api('resume', { token: saved })
    .then(function(r){
      if(r && r.valid){ TOKEN = saved; startApp(r); }
      else { clearToken(); showLogin(); }
    })
    .catch(function(){ clearToken(); showLogin(); });
})();

function showLogin(){
  document.getElementById('boot').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
  document.getElementById('inCode').focus();
}

function doLogin(){
  var code = document.getElementById('inCode').value.trim();
  var name = document.getElementById('inName').value.trim();
  var box = document.getElementById('loginAlert');
  var btn = document.getElementById('loginBtn');

  if(!code || !name){
    box.innerHTML = '<div class="alert err"><span>⚠️</span>両方の項目を入力してください</div>';
    return;
  }

  box.innerHTML = '<div class="alert ok"><div class="spin"></div>確認中…</div>';
  btn.disabled = true;

  api('login', { code: code, userName: name })
    .then(function(r){
      TOKEN = r.token;
      try { localStorage.setItem('receiptToken', r.token); } catch(e){}
      document.getElementById('login').classList.add('hidden');
      box.innerHTML = '';
      btn.disabled = false;
      startApp(r);
    })
    .catch(function(e){
      box.innerHTML = '<div class="alert err"><span>⚠️</span>' + esc(e.message) + '</div>';
      btn.disabled = false;
    });
}

function startApp(u){
  USER = u;
  document.getElementById('boot').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('hUser').textContent = u.name;
  document.getElementById('hDept').textContent = u.isAdmin ? '管理者' : u.department;

  var sel = document.getElementById('fCat');
  sel.innerHTML = '';
  u.categories.forEach(function(c){
    var o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o);
  });

  // 管理者は登録先の部署を選べる
  var box = document.getElementById('deptPickWrap');
  if(u.isAdmin && u.departments.length > 1){
    var d = document.getElementById('fDept');
    d.innerHTML = u.departments.map(function(x){
      return '<option value="'+esc(x)+'">'+esc(x)+'</option>';
    }).join('');
    box.classList.remove('hidden');
  } else {
    box.classList.add('hidden');
  }

  var scope = document.getElementById('fScope');
  if(u.isAdmin){
    scope.innerHTML = '<option value="__ALL__">全部署</option>' +
      u.departments.map(function(d){ return '<option value="'+esc(d)+'">'+esc(d)+'</option>'; }).join('');
    scope.disabled = false;
  }else{
    scope.innerHTML = '<option value="'+esc(u.department)+'">'+esc(u.department)+'</option>';
    scope.disabled = true;
  }
}

function clearToken(){
  TOKEN = null;
  try { localStorage.removeItem('receiptToken'); } catch(e){}
}

function logout(){
  if(!confirm('ログアウトしますか？次回また部署コードの入力が必要になります。')) return;
  clearToken();
  USER = null;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('inCode').value = '';
  document.getElementById('inName').value = '';
  showLogin();
}

// セッション切れの共通処理
function handleFail(e){
  clearAlert();
  if(e.message && e.message.indexOf('SESSION_INVALID') >= 0){
    clearToken();
    document.getElementById('app').classList.add('hidden');
    showLogin();
    document.getElementById('loginAlert').innerHTML =
      '<div class="alert err"><span>⚠️</span>セッションが無効になりました。再度ログインしてください</div>';
    return;
  }
  showAlert('err', e.message);
}

// ── 画像選択 ──
['cam','fil'].forEach(function(id){
  document.getElementById(id).addEventListener('change', function(e){
    var f = e.target.files[0];
    if(f) handleFile(f);
    e.target.value = '';
  });
});

function handleFile(file){
  if(file.size > 8 * 1024 * 1024){
    showAlert('err','画像サイズが大きすぎます（8MB以下にしてください）'); return;
  }
  var img = document.getElementById('preview');
  img.src = URL.createObjectURL(file);
  img.classList.remove('hidden');

  showAlert('load','OCR解析中…');
  var reader = new FileReader();
  reader.onload = function(){
    var b64 = reader.result.split(',')[1];
    api('ocr', { token: TOKEN, image: b64 })
      .then(onOcr)
      .catch(handleFail);
  };
  reader.readAsDataURL(file);
}

function onOcr(r){
  clearAlert();
  document.getElementById('fDate').value = r.date;
  document.getElementById('fStore').value = r.store;
  document.getElementById('fCat').value = r.category;
  items = r.items.map(function(it){
    return { id: Math.random().toString(36).slice(2),
             name: it.name || '', price: it.price == null ? '' : it.price,
             qty: it.qty == null ? '' : it.qty };
  });
  renderItems();
  show('scReview');
}

// ── 品目編集 ──
function renderItems(){
  var box = document.getElementById('itemList');
  box.innerHTML = '';
  items.forEach(function(it){
    var sub = calcSub(it);
    var row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML =
      '<input type="text" placeholder="品目名" value="'+esc(it.name)+'" oninput="upd(\''+it.id+'\',\'name\',this.value)">' +
      '<input type="number" class="num" placeholder="0" value="'+it.price+'" oninput="upd(\''+it.id+'\',\'price\',this.value)">' +
      '<input type="number" class="num" placeholder="—" value="'+it.qty+'" oninput="upd(\''+it.id+'\',\'qty\',this.value)">' +
      '<div class="sub-cell'+(sub!==null?' on':'')+'">'+(sub!==null?yen(sub):'—')+'</div>' +
      '<button class="del" onclick="delItem(\''+it.id+'\')">×</button>';
    box.appendChild(row);
  });
  document.getElementById('itemsTitle').textContent = '品目一覧（'+items.length+'件）';
  document.getElementById('totalAmt').textContent = yen(items.reduce(function(s,it){
    return s + (calcSub(it) || 0);
  },0));
}

function calcSub(it){
  if(it.price === '' || it.price == null) return null;
  var p = Number(it.price);
  var q = (it.qty === '' || it.qty == null) ? 1 : Number(it.qty);
  return p * q;
}
function upd(id, field, val){
  items.forEach(function(it){ if(it.id === id) it[field] = val; });
  var t = items.reduce(function(s,it){ return s + (calcSub(it)||0); },0);
  document.getElementById('totalAmt').textContent = yen(t);
  // 小計セルのみ更新（再描画すると入力位置が飛ぶため）
  var idx = items.findIndex(function(it){ return it.id === id; });
  var cell = document.getElementById('itemList').children[idx].children[3];
  var sub = calcSub(items[idx]);
  cell.textContent = sub !== null ? yen(sub) : '—';
  cell.className = 'sub-cell' + (sub !== null ? ' on' : '');
}
function delItem(id){
  items = items.filter(function(it){ return it.id !== id; });
  if(!items.length) addItem(); else renderItems();
}
function addItem(){
  items.push({ id: Math.random().toString(36).slice(2), name:'', price:'', qty:'' });
  renderItems();
}

// ── 保存 ──
function save(){
  var date = document.getElementById('fDate').value;
  if(!date){ showAlert('err','日付を入力してください'); return; }
  if(!items.some(function(it){ return it.name; })){
    showAlert('err','品目を1つ以上入力してください'); return;
  }
  showAlert('load','登録中…');
  api('save', {
    token: TOKEN,
    payload: {
      date: date,
      store: document.getElementById('fStore').value,
      category: document.getElementById('fCat').value,
      department: USER.isAdmin ? document.getElementById('fDept').value : null,
      items: items
    }
  })
    .then(function(r){
      clearAlert();
      document.getElementById('doneMsg').textContent =
        r.department + 'のシートに' + r.count + '件の品目を記録しました';
      show('scDone');
    })
    .catch(handleFail);
}

// ── 集計 ──
function loadSummary(){
  showAlert('load','集計データを読み込み中…');
  api('summary', { token: TOKEN, department: document.getElementById('fScope').value })
    .then(function(r){
      clearAlert();
      summaryRows = r.rows;
      buildMonths();
      renderSummary();
    })
    .catch(handleFail);
}

function buildMonths(){
  var set = {};
  summaryRows.forEach(function(r){ if(r.date) set[r.date.slice(0,7)] = 1; });
  var months = Object.keys(set).sort().reverse();
  if(!months.length) months = [new Date().toISOString().slice(0,7)];
  var sel = document.getElementById('fMonth');
  var cur = sel.value;
  sel.innerHTML = months.map(function(m){
    return '<option value="'+m+'">'+m.replace('-','年')+'月</option>';
  }).join('');
  if(months.indexOf(cur) >= 0) sel.value = cur;
}

function renderSummary(){
  var month = document.getElementById('fMonth').value;
  var rows = summaryRows.filter(function(r){ return r.date.slice(0,7) === month; });
  var total = rows.reduce(function(s,r){ return s + r.subtotal; }, 0);
  var receipts = uniq(rows.map(function(r){ return r.date + r.store + r.department; })).length;

  var html = '<div class="card">' +
    '<div class="stat-sub">' + month.replace('-','年') + '月 合計</div>' +
    '<div class="big">' + yen(total) + '</div>' +
    '<div class="stat-sub">' + rows.length + '品目 ／ ' + receipts + '件のレシート</div></div>';

  // 部署別（全部署表示時のみ）
  if(document.getElementById('fScope').value === '__ALL__'){
    html += groupCard('部署別', rows, 'department');
  }
  html += barCard('カテゴリ別内訳', rows);
  html += groupCard('登録者別', rows, 'user');
  html += recentCard(rows);

  document.getElementById('summaryBody').innerHTML = html;
}

function barCard(title, rows){
  var map = {};
  rows.forEach(function(r){ map[r.category] = (map[r.category]||0) + r.subtotal; });
  var list = Object.keys(map).map(function(k){ return {k:k, v:map[k]}; })
    .filter(function(x){ return x.v > 0; }).sort(function(a,b){ return b.v - a.v; });
  if(!list.length) return '';
  var max = list[0].v;
  var body = list.map(function(x){
    var c = CAT_COLOR[x.k] || CAT_COLOR['その他'];
    return '<div class="bar-row"><div class="bar-top">' +
      '<span class="tag" style="background:'+c[0]+';color:'+c[1]+'">'+esc(x.k)+'</span>' +
      '<span style="font-weight:600">'+yen(x.v)+'</span></div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:'+
      Math.round(x.v/max*100)+'%;background:'+c[1]+'"></div></div></div>';
  }).join('');
  return '<div class="card"><div class="card-title">'+title+'</div>'+body+'</div>';
}

function groupCard(title, rows, key){
  var map = {};
  rows.forEach(function(r){
    if(!r[key]) return;
    if(!map[r[key]]) map[r[key]] = {total:0, keys:{}};
    map[r[key]].total += r.subtotal;
    map[r[key]].keys[r.date + r.store] = 1;
  });
  var list = Object.keys(map).map(function(k){
    return {k:k, v:map[k].total, c:Object.keys(map[k].keys).length};
  }).filter(function(x){ return x.v > 0; }).sort(function(a,b){ return b.v - a.v; });
  if(!list.length) return '';
  var body = list.map(function(x){
    return '<div class="list-row"><div><div style="font-size:14px;font-weight:600">'+esc(x.k)+'</div>' +
      '<div class="muted" style="font-size:12px">'+x.c+'件</div></div>' +
      '<div style="font-size:16px;font-weight:700;color:var(--primary)">'+yen(x.v)+'</div></div>';
  }).join('');
  return '<div class="card"><div class="card-title">'+title+'</div>'+body+'</div>';
}

function recentCard(rows){
  var recent = rows.slice().sort(function(a,b){ return b.date.localeCompare(a.date); }).slice(0,10);
  if(!recent.length){
    return '<div class="card"><div class="card-title">直近の登録</div>' +
      '<p class="muted center" style="padding:10px 0">データがありません</p></div>';
  }
  var body = recent.map(function(r){
    var c = CAT_COLOR[r.category] || CAT_COLOR['その他'];
    return '<div class="list-row"><div style="flex:1;min-width:0">' +
      '<div class="ellip" style="font-size:13px;font-weight:600">'+esc(r.item||'—')+'</div>' +
      '<div class="muted" style="font-size:11px">'+esc(r.date)+'　'+esc(r.store)+'</div></div>' +
      '<div style="text-align:right;flex-shrink:0;margin-left:8px">' +
      '<div style="font-size:14px;font-weight:700">'+yen(r.subtotal)+'</div>' +
      (r.category ? '<span class="tag" style="background:'+c[0]+';color:'+c[1]+'">'+esc(r.category)+'</span>' : '') +
      '</div></div>';
  }).join('');
  return '<div class="card"><div class="card-title">直近の登録（10件）</div>'+body+'</div>';
}

// ── 画面制御 ──
function switchTab(t){
  tab = t;
  document.getElementById('tabUpload').classList.toggle('on', t === 'upload');
  document.getElementById('tabSummary').classList.toggle('on', t === 'summary');
  document.getElementById('hTitle').textContent = t === 'upload' ? 'レシート登録' : '月次集計';
  clearAlert();
  if(t === 'upload'){ toUpload(); }
  else { show('scSummary'); loadSummary(); }
}

function toUpload(){
  items = [];
  document.getElementById('preview').classList.add('hidden');
  document.getElementById('fStore').value = '';
  clearAlert();
  show('scUpload');
}

function show(id){
  ['scUpload','scReview','scDone','scSummary'].forEach(function(s){
    document.getElementById(s).classList.toggle('hidden', s !== id);
  });
}

function showAlert(type, msg){
  var box = document.getElementById('alert');
  if(type === 'load'){
    box.innerHTML = '<div class="alert ok"><div class="spin"></div>'+esc(msg)+'</div>';
  }else{
    box.innerHTML = '<div class="alert err"><span>⚠️</span>'+esc(msg)+'</div>';
  }
}
function clearAlert(){ document.getElementById('alert').innerHTML = ''; }

// ── ユーティリティ ──
function yen(n){ return '¥' + Number(n||0).toLocaleString('ja-JP'); }
function uniq(a){ return a.filter(function(v,i){ return a.indexOf(v) === i; }); }
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
